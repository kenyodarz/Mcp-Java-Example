plugins {
    id 'java'
    id 'jacoco'
}

dependencies {
    // Domain model for gateway interfaces
    implementation project(':model')

    // AWS SDK - Secrets Manager
    implementation 'software.amazon.awssdk:secretsmanager:2.22.0'
    implementation 'software.amazon.awssdk:sts:2.22.0'

    // Reactor for reactive types (Mono, Flux)
    implementation 'io.projectreactor:reactor-core'

    // Lombok for boilerplate
    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"
    testCompileOnly "org.projectlombok:lombok"
    testAnnotationProcessor "org.projectlombok:lombok"

    // Logging
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'io.projectreactor:reactor-test'
}

test {
    useJUnitPlatform()
}

